name: Auto Update IPTV
on:
  schedule:
    - cron: '0 * * * *' # هەموو کاتژمێرێک جارێک ئیش دەکات
  workflow_dispatch: # بۆ ئەوەی بتوانیت بە دەستیش دایبگیرسێنیت

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python update_links.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add all_channels.m3u
          git commit -m "Update All Channels" || exit 0
          git push
